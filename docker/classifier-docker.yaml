classify:
  meta_to_stdout: False
  models:
    - id: 0
      name : "WR"
      model_file: "/etc/cacophony/models/server-x/default/saved_model.pb"
      thumbnail_model: True
    - id: 1000 #allow for 1000 updates of model before id overlaps
      name : "FP Filter"
      model_file: "/etc/cacophony/models/rf/default/model.pkl"
      type: "RandomForest"
      ignored_tags: ["animal","vehicle"]
tracking:
  model: /etc/cacophony/models/yolo/best.pt
  params:
    "mass_change_percent": null
    "max_blanks": 30
  filters:
    "min_duration_secs": 0.2